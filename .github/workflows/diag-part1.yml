name: diagnose docintel part1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diag_part1.py'
      - '.github/workflows/diag-part1.yml'
      - 'docintel_part1.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/diag_part1.py
