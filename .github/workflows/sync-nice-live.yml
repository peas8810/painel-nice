name: sync NICE live data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [nice-sync]
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/sync-nice-live.yml'

permissions:
  contents: write

concurrency:
  group: sync-nice-live
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Contexto da sincronização
        shell: bash
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Motivo: ${{ github.event.client_payload.reason || 'agendado/manual' }}"
          echo "Protocolo: ${{ github.event.client_payload.id || 'n/a' }}"

      - name: Consultar backend NICE
        shell: bash
        run: |
          set -euo pipefail
          API='https://script.google.com/macros/s/AKfycby2HN1DU9SXupv2WlthavWzXMr5k1RsdpzDL-Dahd9NN2-TvDvEqT-wqMM6F9fP2DnY/exec'
          BUST="$(date +%s%N)"
          # Keep the previous cache if any required public query fails.
          fetch_public() {
            local action="$1" output="$2" extra="${3:-}" status rc attempt
            for attempt in 1 2 3 4; do
              rc=0
              status=$(curl -sSL --connect-timeout 15 --max-time 90 \
                -w '%{http_code}' "$API?action=$action$extra&_=$BUST" -o "$output") || rc=$?
              echo "Consulta $action: tentativa $attempt/4, HTTP ${status:-000}, curl $rc"
              if [ "$rc" -eq 0 ] && [ "$status" = "200" ]; then
                if python - "$output" "$action" <<'PY'
          import json
          import sys
          from pathlib import Path
          path, action = sys.argv[1:]
          try:
              payload = json.loads(Path(path).read_text(encoding='utf-8'))
          except (ValueError, OSError):
              print(f'::warning::Consulta {action}: resposta não é JSON; confira acesso público do Web App.')
              raise SystemExit(1)
          if not isinstance(payload, dict) or payload.get('ok') is not True:
              print(f'::warning::Consulta {action}: backend retornou falha; confira a execução no Apps Script.')
              raise SystemExit(1)
          PY
                then
                  return 0
                fi
              fi
              if [ "$attempt" -lt 4 ]; then sleep $((attempt * 5)); fi
            done
            echo "::error title=Falha no Apps Script::Consulta $action falhou após 4 tentativas. Último HTTP: ${status:-000}; curl: $rc. HTTP 401/403 ou resposta HTML exigem conferir a implantação e o acesso público. A base anterior foi preservada."
            return 1
          }
          fetch_public health /tmp/health.json
          fetch_public stats /tmp/stats.json
          fetch_public projects /tmp/projects.json '&limit=500'
          fetch_public cert_dashboard /tmp/cert_dashboard.json

      - name: Validar e gerar cache público
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              with open(path, 'r', encoding='utf-8') as f:
                  return json.load(f)

          health = load('/tmp/health.json')
          stats = load('/tmp/stats.json')
          projects = load('/tmp/projects.json')
          cert_dashboard = load('/tmp/cert_dashboard.json')

          if not health.get('ok'):
              raise SystemExit('Health check NICE retornou falha')
          if not stats.get('ok'):
              raise SystemExit('Stats NICE retornou falha')
          if not projects.get('ok'):
              raise SystemExit('Projects NICE retornou falha')
          if not cert_dashboard.get('ok'):
              raise SystemExit('Dashboard público de certificados retornou falha')

          out = {
              'ok': True,
              'synced_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'health': health,
              'stats': stats,
              'projects': projects,
              'source': 'Google Apps Script via GitHub Actions'
          }
          Path('protocolos/live-data.json').write_text(
              json.dumps(out, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8'
          )

          cert_out = dict(cert_dashboard)
          cert_out['synced_at'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          cert_out['source'] = 'Google Apps Script via GitHub Actions'
          Path('certificados/dashboard/live-data.json').write_text(
              json.dumps(cert_out, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Publicar somente se houver alteração
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          snapshot=$(mktemp -d)
          trap 'rm -rf "$snapshot"' EXIT
          cp protocolos/live-data.json "$snapshot/projects.json"
          cp certificados/dashboard/live-data.json "$snapshot/certificates.json"
          for attempt in 1 2 3 4; do
            # Refresh the disposable runner checkout; restore only validated cache files.
            git fetch origin main
            git reset --hard origin/main
            python - "$snapshot" <<'PY'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path
          
          for source, target in [
              ('projects.json', 'protocolos/live-data.json'),
              ('certificates.json', 'certificados/dashboard/live-data.json'),
          ]:
              incoming = Path(sys.argv[1]) / source
              destination = Path(target)
              new = json.loads(incoming.read_text(encoding='utf-8'))
              old = json.loads(destination.read_text(encoding='utf-8'))
              def timestamp(payload):
                  value = payload.get('synced_at')
                  return datetime.fromisoformat(value.replace('Z', '+00:00')) if value else None
              old_time, new_time = timestamp(old), timestamp(new)
              if old_time and new_time and old_time >= new_time:
                  print(f'{target}: mantida a base mais recente do repositório.')
                  continue
              destination.write_bytes(incoming.read_bytes())
          PY
            if git diff --quiet -- protocolos/live-data.json certificados/dashboard/live-data.json; then
              echo 'Sem alterações pendentes nas bases públicas.'
              exit 0
            fi
            git add protocolos/live-data.json certificados/dashboard/live-data.json
            git commit -m 'chore: sincroniza base pública NICE'
            if git push origin HEAD:main; then
              echo 'Bases públicas sincronizadas.'
              exit 0
            fi
            echo "::warning::Publicação recusada na tentativa $attempt/4; atualizando a base antes de tentar novamente."
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 2)); fi
          done
          echo '::error::Não foi possível publicar após 4 tentativas. Confira a permissão de escrita e as regras da branch main.'
          exit 1
