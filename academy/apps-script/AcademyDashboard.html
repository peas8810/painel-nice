<!DOCTYPE html><html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17314c;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#102a43;color:white;padding:26px clamp(16px,4vw,50px)}.top h1{margin:4px 0 3px;font-size:28px}.top small{color:#b8cbd8}.layout{max-width:1400px;margin:auto;padding:26px 22px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.stat{background:white;border:1px solid #dce5ec;border-radius:12px;padding:18px}.stat b{font-size:27px;display:block}.stat span{font-size:12px;color:#617689}.panel{background:white;margin-top:22px;border:1px solid #dce5ec;border-radius:14px;overflow:hidden}.toolbar{padding:18px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.toolbar h2{margin:0;font-size:19px}input,select,button{padding:10px 12px;border:1px solid #d0dce6;border-radius:8px;background:white;font:inherit}input{min-width:220px}button{background:#102a43;color:white;cursor:pointer;border-color:#102a43}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1040px}th,td{border-top:1px solid #e9eef3;text-align:left;padding:12px;font-size:13px}th{background:#f8fafc;color:#64788c;font-size:11px;text-transform:uppercase}small,.muted{color:#6a8093}.pill{border-radius:100px;background:#e8f1f8;padding:5px 8px;white-space:nowrap;display:inline-block;font-size:11px;font-weight:700}.approved{background:#e2f4e9;color:#126237}.rejected{background:#fbe9e9;color:#9a2424}.pending{background:#fff2da;color:#825007}.tools{display:flex;gap:10px;flex-wrap:wrap}#message{padding:20px;color:#66788b}.note{font-size:12px;padding:0 18px 15px;color:#6a8093}</style></head>
<body><div class="top"><small>EDITORA UJN / GESTÃO INTERNA</small><h1>Protocolo Academy · Dashboard</h1><small>Cadastros, deferimentos, correções, pagamentos e documentos</small></div>
<main class="layout"><section class="stats" id="stats"></section>
<section class="panel"><div class="toolbar"><h2>Solicitações registradas</h2><div class="tools"><input id="query" placeholder="Buscar aluno, atividade ou código"><select id="status"><option value="">Todos os status</option><option value="APROVADO">Deferidos</option><option value="REPROVADO">Indeferidos</option><option value="PENDENTE_DOCUMENTOS">Correção / documentos</option></select><select id="payment"><option value="">Todos os pagamentos</option><option value="CONFIRMADO">Confirmados</option><option value="PENDENTE">Pendentes</option><option value="NÃO INICIADO">Não iniciados</option></select><button id="reload">Atualizar</button></div></div>
<div id="message">Carregando dados autorizados…</div><div class="scroll"><table><thead><tr><th>Solicitação</th><th>Aluno</th><th>Atividade</th><th>Horas</th><th>Decisão</th><th>Pagamento</th><th>Evidências</th><th>Certificado</th><th>Atualizado</th></tr></thead><tbody id="body"></tbody></table></div><div class="note" id="time"></div></section></main>
<script>
let state={indicadores:{},registros:[]};const $=id=>document.getElementById(id);
function label(s){return String(s||'').replace(/_/g,' ')}
function pill(s){const v=String(s||'');const cls=/APROVADO|CONFIRMADO|ATIVO/.test(v)?'approved':/REPROVADO|INDEFERIDO/.test(v)?'rejected':/PENDENTE|CORRECAO|CORREÇÃO/.test(v)?'pending':'';let el=document.createElement('span');el.className='pill '+cls;el.textContent=label(v);return el}
function td(tr,text){let el=document.createElement('td');el.textContent=String(text??'');tr.appendChild(el);return el}
function refresh(){const q=$('query').value.toLowerCase().trim(),st=$('status').value,pm=$('payment').value;
const records=state.registros.filter(r=>(!q||[r.id,r.nome,r.email,r.atividade].some(v=>String(v).toLowerCase().includes(q)))&&(!st||r.situacao===st)&&(!pm||r.pagamento===pm));
const body=$('body');body.replaceChildren();records.forEach(r=>{const tr=document.createElement('tr');td(tr,r.id);td(tr,r.nome);td(tr,r.atividade);td(tr,r.horasVerificadas+' / '+r.horasDeclaradas);td(tr,'').appendChild(pill(r.situacao));td(tr,'').appendChild(pill(r.pagamento));td(tr,r.documentos);td(tr,r.certificado||'—');td(tr,r.atualizado?r.atualizado.slice(0,16).replace('T',' '):'');body.appendChild(tr)});
$('message').textContent=records.length+' solicitação(ões) exibida(s).'}
function load(){ $('reload').disabled=true;google.script.run.withSuccessHandler(data=>{state=data;const defs=[['total','Cadastradas'],['emAnalise','Em análise'],['aprovados','Deferidas'],['reprovados','Indeferidas'],['correcao','Correções'],['pagos','Pagamentos confirmados'],['pagamentosPendentes','Pagamentos pendentes'],['emitidos','Certificados ativos']];$('stats').replaceChildren();defs.forEach(([key,label])=>{let card=document.createElement('div');card.className='stat';const val=document.createElement('b');val.textContent=String(data.indicadores[key]||0);const name=document.createElement('span');name.textContent=label;card.append(val,name);$('stats').appendChild(card)});$('time').textContent='Atualizado em: '+new Date(data.geradoEm).toLocaleString('pt-BR')+' · Exibindo até 500 registros recentes';$('reload').disabled=false;refresh()}).withFailureHandler(e=>{$('message').textContent='Erro: '+e.message;$('reload').disabled=false}).academyDashboardResumo()}
['query','status','payment'].forEach(x=>$(x).addEventListener(x==='query'?'input':'change',refresh));$('reload').addEventListener('click',load);load();
</script></body></html>
