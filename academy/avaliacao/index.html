<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliações | Academy</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/academy-theme.css?v=5"><style>main{max-width:1000px;margin:32px auto;padding:20px}section{padding:24px;border:1px solid #ccd9dd;border-radius:14px;margin:20px 0}label{display:block;margin:12px 0}button,select,textarea,input{padding:12px;max-width:100%;margin:6px}article{padding:12px;border-bottom:1px solid #ddd}#status{padding:16px;background:#eef5f5}</style></head><body><main><h1>Avaliações</h1><p>Fila institucional, documentos e pareceres em um só lugar.</p><p id="status" role="status">Entre com sua conta de avaliador.</p><a href="../portal/">Entrar no portal</a><button id="reload">Atualizar fila</button><section><label>Protocolo<select id="queue"></select></label><button id="open">Abrir análise</button></section><section id="detail" hidden><h2 id="activity"></h2><p id="context"></p><div id="documents"></div><label>Parecer / justificativa<textarea id="note" minlength="15" maxlength="1500" rows="4"></textarea></label><label>Decisão do fluxo<select id="decision"><option value="AVANCAR">Encaminhar à próxima etapa aplicável</option><option value="DEVOLVER">Solicitar complementação</option><option value="RETOMAR">Retomar após complementação</option><option value="CONCLUIR">Concluir última etapa</option></select></label><button id="decide">Registrar parecer</button><p>A conclusão do fluxo não aprova automaticamente o certificado. A decisão acadêmica final permanece na gestão autorizada.</p><h3>Histórico</h3><div id="timeline"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/auth-config.js"></script><script src="reviewer.js"></script><script src="../assets/navigation.js"></script></body></html>
